<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoşgeldin Ya Şehr-i Ramazan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Montserrat:wght@300;400;700;900&family=Pinyon+Script&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #020617;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        .main-container {
            width: 1080px;
            height: 1080px;
            position: relative;
            background: radial-gradient(circle at top right, #1e1b4b 0%, #020617 70%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 20px solid transparent;
            border-image: linear-gradient(to bottom, #d4af37, #996515) 1;
            box-sizing: border-box;
        }

        /* Yıldızlar */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Hilal */
        .moon {
            position: absolute;
            top: 100px;
            right: 150px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            box-shadow: 25px 15px 0 0 #d4af37;
            filter: blur(1px) drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
            transform: rotate(-15deg);
        }

        /* Kandil */
        .lantern {
            position: absolute;
            top: 0;
            animation: swing 3s infinite ease-in-out;
            transform-origin: top center;
        }

        @keyframes swing {

            0%,
            100% {
                transform: rotate(-3deg);
            }

            50% {
                transform: rotate(3deg);
            }
        }

        .text-glow {
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }

        .gold-bg {
            background: linear-gradient(135deg, #d4af37 0%, #f1d592 50%, #996515 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .pattern-overlay {
            position: absolute;
            inset: 0;
            background-image: url('https://www.transparenttextures.com/patterns/arabesque.png');
            opacity: 0.05;
            pointer-events: none;
        }

        .logo-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
    </style>
</head>

<body>

    <div class="main-container mx-auto" id="greeting-card">
        <div class="pattern-overlay"></div>

        <!-- Dinamik Yıldızlar -->
        <script>
            const container = document.getElementById('greeting-card');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (2 + Math.random() * 3) + 's');
                container.appendChild(star);
            }
        </script>

        <!-- Hilal -->
        <div class="moon"></div>

        <!-- Kandiller -->
        <div class="lantern" style="left: 100px; height: 300px;">
            <svg width="60" height="100" viewBox="0 0 60 100">
                <path d="M30 0V20M10 20H50L55 30L50 80H10L5 30L10 20" stroke="#d4af37" fill="rgba(212, 175, 55, 0.2)"
                    stroke-width="2" />
                <circle cx="30" cy="50" r="8" fill="#ffcc00">
                    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
                </circle>
            </svg>
        </div>
        <div class="lantern" style="left: 250px; height: 200px;">
            <svg width="40" height="70" viewBox="0 0 40 70">
                <path d="M20 0V15M5 15H35L38 22L35 60H5L2 22L5 15" stroke="#d4af37" fill="rgba(212, 175, 55, 0.1)"
                    stroke-width="2" />
                <circle cx="20" cy="35" r="5" fill="#ffcc00">
                    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
                </circle>
            </svg>
        </div>

        <!-- Ana Metin -->
        <div class="text-center z-10 px-20">
            <h2 class="text-[#d4af37] font-['Pinyon_Script'] text-6xl mb-4 italic">Bereket, Rahmet ve Mağfiret Ayı</h2>
            <h1
                class="text-8xl font-['Cinzel_Decorative'] font-black gold-bg text-glow tracking-widest leading-none mb-8">
                HOŞGELDİN<br>YA ŞEHR-İ<br>RAMAZAN
            </h1>
            <div class="w-48 h-1 bg-gradient-to-r from-transparent via-[#d4af37] to-transparent mx-auto mb-8"></div>
            <p class="text-slate-400 text-xl font-light tracking-[0.3em] uppercase">
                Huzur ve Umut Getirmesi Dileğiyle
            </p>
        </div>

        <!-- Logolar Alt Kısım -->
        <div class="absolute bottom-16 inset-x-16 flex justify-between items-end">

            <!-- Akviyol Ambalaj Logosu -->
            <div class="logo-box">
                <div class="relative w-16 h-16 flex items-center justify-center">
                    <svg viewBox="0 0 100 100" class="w-full h-full">
                        <!-- Siyah Eğri -->
                        <path d="M10 80 Q 5 20 80 15 L 90 20 Q 20 25 15 85 Z" fill="black" />
                        <!-- Turuncu A -->
                        <path d="M35 80 L 55 25 L 75 80 M 42 60 H 68" stroke="#f97316" stroke-width="8" fill="none"
                            stroke-linecap="round" />
                    </svg>
                </div>
                <div class="flex flex-col">
                    <span class="text-white font-black text-xl tracking-tighter leading-none">AKVİYOL</span>
                    <span class="text-orange-500 font-bold text-xs tracking-[0.2em] mt-1">AMBALAJ</span>
                </div>
            </div>

            <!-- Net Muhasebe Logosu -->
            <div class="logo-box pl-6">
                <div class="flex flex-col items-end">
                    <span class="text-white font-black text-xl tracking-tighter leading-none">NET MUHASEBE</span>
                    <span class="text-indigo-400 font-medium text-[8px] tracking-widest mt-1 uppercase">Yapay Zeka
                        Destekli Finansal Çözümler</span>
                </div>
                <div
                    class="relative w-16 h-16 bg-white/10 rounded-full border border-white/20 flex items-center justify-center p-2">
                    <svg viewBox="0 0 100 100" class="w-full h-full">
                        <!-- M Harfi -->
                        <path d="M20 70 V 30 L 50 50 L 80 30 V 70" stroke="#3b82f6" stroke-width="8" fill="none"
                            stroke-linecap="round" />
                        <!-- Altın Ok -->
                        <path d="M15 75 L 45 45 L 60 60 L 90 20 M 90 20 H 75 M 90 20 V 35" stroke="#d4af37"
                            stroke-width="5" fill="none" stroke-linecap="round" />
                    </svg>
                </div>
            </div>

        </div>

        <!-- Dipnot Süsleme -->
        <div class="absolute bottom-6 w-full text-center">
            <span class="text-[10px] text-slate-700 font-bold uppercase tracking-[0.5em]">Ramazan-ı Şerif Mübarek
                Olsun</span>
        </div>
    </div>

</body>

</html>
