name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat
        run: |
          curl -s https://netmuhasebe.net.tr/api/ping
          echo "Heartbeat sent to https://netmuhasebe.net.tr/api/ping"
